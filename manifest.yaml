manifestVersion: 1
name: '@vcjdeboer/esp32-s3'
version: 2026.09.29.1
description: >
  Drive an ESP32-S3 from swamp over USB serial. One model type, `s3-device`,
  speaks a JSON line protocol: one command line in, one JSON object out. It
  knows nothing about what the board is attached to, so it serves a bare S3 as
  well as one carrying sensors or a display, and records every exchange as
  versioned data with an explicit outcome. Screen-specific methods live in
  `@vcjdeboer/s3-panel`, which builds on the same base.
repository: 'https://github.com/vcjdeboer/esp32-s3'
license: MIT
models:
  - s3_device.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
